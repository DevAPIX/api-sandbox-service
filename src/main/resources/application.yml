spring:
  application:
    name: sandbox-service
  config:
    import: optional:configserver:${SPRING_CONFIG_IMPORT_URL:http://localhost:8888}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
